name: Notify Python SDK of OpenAPI changes
on:
  push:
    branches: [main]
    paths: [openapi.yaml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notify-python-sdk
  cancel-in-progress: false
jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Explain manual SDK updates when App is not configured
        if: vars.SDK_APP_CLIENT_ID == ''
        run: echo 'SDK_APP_CLIENT_ID is absent; no cross-repository dispatch was sent. Run Update SDK from OpenAPI manually in sullyai-python Actions on main.' >> "$GITHUB_STEP_SUMMARY"
      - name: Create installation token for Python repository only
        if: vars.SDK_APP_CLIENT_ID != ''
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SDK_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_APP_PRIVATE_KEY }}
          owner: Odiggo
          repositories: sullyai-python
          permission-contents: write
      - name: Dispatch exact merged source SHA
        if: vars.SDK_APP_CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SPEC_SHA: ${{ github.sha }}
        run: |
          jq -n --arg sha "$SPEC_SHA" '{event_type:"openapi-updated",client_payload:{spec_sha:$sha}}' |
            gh api --method POST repos/Odiggo/sullyai-python/dispatches --input -
