name: Validate OpenAPI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - name: Install pinned oasdiff
        run: |
          curl --fail --location --retry 3 https://github.com/oasdiff/oasdiff/releases/download/v1.32.1/oasdiff_1.32.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          curl --fail --location --retry 3 https://github.com/oasdiff/oasdiff/releases/download/v1.32.1/checksums.txt -o "$RUNNER_TEMP/oasdiff-checksums.txt"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          entries = dict(line.split()[::-1] for line in (temp / 'oasdiff-checksums.txt').read_text().splitlines())
          assert hashlib.sha256((temp / 'oasdiff.tar.gz').read_bytes()).hexdigest() == entries['oasdiff_1.32.1_linux_amd64.tar.gz']
          PY
          mkdir "$RUNNER_TEMP/oasdiff-bin"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-bin" oasdiff
          echo "$RUNNER_TEMP/oasdiff-bin" >> "$GITHUB_PATH"
      - name: Compare contract with base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-origin/main}}"
          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then base=origin/main; fi
          python scripts/check_breaking.py "$base"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-breaking-report
          path: .sdk-smoke/breaking.json
          if-no-files-found: ignore

  sdk-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: python scripts/sdk_smoke.py ${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-${{ matrix.language }}-generation-log
          path: .sdk-smoke/*-generation.log
          if-no-files-found: ignore
